# ── Server ──
server.port=8080

# ── H2 Database (file-persisted) ──
spring.datasource.url=jdbc:h2:file:./data/tiffindb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ──
app.jwt.secret=TiffinServiceSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024!
app.jwt.expiration-ms=86400000

# ── Logging ──
logging.level.com.tiffin=INFO

# ── SQL init (disabled — using DataSeeder.java) ──
spring.sql.init.mode=never
